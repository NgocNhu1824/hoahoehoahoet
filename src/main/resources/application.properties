# ===============================
# DATABASE CONFIGURATION (Local Dev: H2 / Production: PostgreSQL)
# ===============================
spring.main.web-application-type=servlet
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bloomresin;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===============================
# JSP VIEW ENGINE
# ===============================
spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

# ===============================
# STATIC FILES
# ===============================
spring.web.resources.static-locations=classpath:/static/,file:/tmp/uploads/
spring.web.resources.add-mappings=true

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# SESSION CONFIGURATION
# ===============================
spring.session.store-type=none
server.servlet.session.timeout=30m

# ===============================
# MAIL CONFIG
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-gmail@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# SERVER / PROXY SETTINGS (Render)
# ===============================

server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.ssl.enabled=false

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always

# Spring Security debug
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
